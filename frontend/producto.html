<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Producto — JG Parfums</title>
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/favicon-180.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .product-layout {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
    padding-top: var(--space-8);
    padding-bottom: var(--space-16);
  }
  @media (min-width: 1024px) {
    .product-layout {
      flex-direction: row;
      align-items: flex-start;
      gap: var(--space-16);
    }
    .product-gallery { position: sticky; top: 96px; flex: 0 0 44%; }
    .product-info { flex: 1; max-width: 520px; }
  }
  .product-gallery-main {
    aspect-ratio: 1 / 1;
    background: var(--ink-100);
    overflow: hidden;
  }
  .product-gallery-main img { width: 100%; height: 100%; object-fit: cover; }
  .product-thumbs { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
  .product-thumbs img {
    width: 64px; height: 64px; object-fit: cover; cursor: pointer;
    border: 1px solid var(--ink-100);
  }
  .product-house { color: var(--text-muted); margin-bottom: var(--space-1); }
  .product-price { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin-top: var(--space-4); margin-bottom: 0; }
  .product-description { margin-top: var(--space-4); margin-bottom: 0; }

  .product-notes {
    margin-top: var(--space-8);
    padding-top: var(--space-6);
    border-top: 1px solid var(--ink-100);
  }
  .product-notes-heading { font-size: 12px; letter-spacing: 0.03em; color: var(--text-muted); margin: 0 0 var(--space-2); }

  .qty-row { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-6); margin-bottom: var(--space-4); }
  .qty-control { display: flex; align-items: center; border: 1px solid var(--ink-300); border-radius: var(--radius); }
  .qty-control button { width: 44px; height: 44px; border: none; background: none; font-size: 18px; cursor: pointer; }
  .qty-control span { width: 32px; text-align: center; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>

<header class="nav">
  <div class="container nav-inner">
    <a href="/index.html" aria-label="JG Parfums, inicio">
      <img class="nav-logo" src="/assets/logos/jg-parfums-horizontal.svg" alt="JG Parfums">
    </a>
    <ul class="nav-links">
      <li><a href="/catalogo.html">Catálogo</a></li>
      <li><a href="/mi-cuenta.html">Mi cuenta</a></li>
    </ul>
    <div class="nav-actions">
      <a class="nav-icon-btn" href="/mi-cuenta.html" aria-label="Mi cuenta">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      </a>
      <a class="nav-icon-btn" href="/carrito.html" aria-label="Carrito">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h2l1.5 10.5a2 2 0 0 0 2 1.5h7a2 2 0 0 0 2-1.7L20 9H7"/><circle cx="10" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
        <span class="nav-cart-count" data-cart-count hidden>0</span>
      </a>
    </div>
  </div>
</header>

<main id="main">
  <div class="container">
    <div id="productContent" class="product-layout"></div>
    <p class="empty-state" id="notFound" hidden>No encontramos este producto. <a class="link" href="/catalogo.html">Vuelve al catálogo</a>.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <img src="/assets/logos/jg-parfums-horizontal-blanco.svg" alt="JG Parfums" style="height:24px;">
      <p class="text-muted text-small" style="margin-top:var(--space-4);">Perfumería de nicho en Colombia.</p>
    </div>
    <div>
      <p class="text-caption" style="margin-bottom:var(--space-3);">Tienda</p>
      <ul class="footer-links">
        <li><a href="/catalogo.html" class="text-muted">Catálogo</a></li>
        <li><a href="/mi-cuenta.html" class="text-muted">Mi cuenta</a></li>
        <li><a href="/carrito.html" class="text-muted">Carrito</a></li>
      </ul>
    </div>
    <div>
      <p class="text-caption" style="margin-bottom:var(--space-3);">Pago seguro</p>
      <p class="text-muted text-small">Tarjetas, PSE, Nequi, botón Bancolombia y Mercado Pago.</p>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get('slug');
  let quantity = 1;
  let currentProduct = null;

  function renderProduct(product) {
    document.getElementById('pageTitle').textContent = `${product.name} — JG Parfums`;
    const images = product.images.length ? product.images : [{ url: '', alt_text: product.name }];
    const lowStock = product.stock > 0 && product.stock <= 3;

    document.getElementById('productContent').innerHTML = `
      <div class="product-gallery">
        <div class="product-gallery-main">
          ${images[0].url ? `<img id="mainImage" src="${images[0].url}" alt="${images[0].alt_text}">` : ''}
        </div>
        ${images.length > 1 ? `<div class="product-thumbs">
          ${images.map((img) => `<img src="${img.url}" alt="${img.alt_text}" data-full="${img.url}">`).join('')}
        </div>` : ''}
      </div>
      <div class="product-info">
        ${product.house ? `<p class="product-house text-small">${product.house}</p>` : ''}
        <h1 class="h1">${product.name}</h1>
        <p class="product-price">${formatCOP(product.price)}</p>
        <p class="text-muted product-description">${product.description}</p>

        ${product.stock === 0
          ? `<p class="badge badge-danger" style="margin-top:var(--space-4);">Agotado</p>`
          : lowStock ? `<p class="badge badge-warning" style="margin-top:var(--space-4);">Últimas ${product.stock} unidades</p>` : ''}

        <div class="product-notes">
          <p class="product-notes-heading">Ficha olfativa</p>
          <dl class="spec-list">
            ${product.notes_top ? `<div class="spec-row"><dt>Salida</dt><dd>${product.notes_top}</dd></div>` : ''}
            ${product.notes_heart ? `<div class="spec-row"><dt>Corazón</dt><dd>${product.notes_heart}</dd></div>` : ''}
            ${product.notes_base ? `<div class="spec-row"><dt>Fondo</dt><dd>${product.notes_base}</dd></div>` : ''}
            ${product.concentration ? `<div class="spec-row"><dt>Concentración</dt><dd>${product.concentration}</dd></div>` : ''}
            <div class="spec-row"><dt>Tamaño</dt><dd>${product.size_ml} ml</dd></div>
          </dl>
        </div>

        <div class="qty-row">
          <div class="qty-control">
            <button type="button" id="qtyMinus" aria-label="Restar cantidad">−</button>
            <span id="qtyValue">1</span>
            <button type="button" id="qtyPlus" aria-label="Sumar cantidad">+</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="addToCartBtn" ${product.stock === 0 ? 'disabled' : ''}>
          ${product.stock === 0 ? 'Agotado' : 'Agregar al carrito'}
        </button>
      </div>
    `;

    document.querySelectorAll('.product-thumbs img').forEach((thumb) => {
      thumb.addEventListener('click', () => {
        document.getElementById('mainImage').src = thumb.dataset.full;
      });
    });

    document.getElementById('qtyMinus').addEventListener('click', () => {
      quantity = Math.max(1, quantity - 1);
      document.getElementById('qtyValue').textContent = quantity;
    });
    document.getElementById('qtyPlus').addEventListener('click', () => {
      quantity = Math.min(product.stock, quantity + 1);
      document.getElementById('qtyValue').textContent = quantity;
    });
    document.getElementById('addToCartBtn').addEventListener('click', () => {
      addToCart(product, quantity);
      document.getElementById('addToCartBtn').textContent = 'Agregado ✓';
      setTimeout(() => { document.getElementById('addToCartBtn').textContent = 'Agregar al carrito'; }, 1500);
    });
  }

  async function loadProduct() {
    if (!slug) {
      document.getElementById('notFound').hidden = false;
      return;
    }
    try {
      currentProduct = await apiFetch(`/products/${encodeURIComponent(slug)}`);
      renderProduct(currentProduct);
    } catch (err) {
      document.getElementById('notFound').hidden = false;
    }
  }
  loadProduct();
</script>
</body>
</html>
