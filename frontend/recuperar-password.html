<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar contraseña — JG Parfums</title>
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/favicon-180.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .auth-wrap { padding-top: var(--space-16); padding-bottom: var(--space-16); }
  .form-error { color: var(--danger); margin-bottom: var(--space-4); }
</style>
</head>
<body>
<main>
  <div class="container auth-wrap">
    <div class="access-card">
      <a href="/index.html"><img class="access-mark" src="/assets/logos/jg-star.svg" alt="JG Parfums, inicio"></a>
      <h1 class="h1" style="margin-bottom: var(--space-4);">Recupera tu contraseña</h1>
      <p class="text-muted" style="margin-bottom: var(--space-6);">Te enviamos un enlace para elegir una nueva.</p>

      <form id="forgotForm">
        <p class="form-error" id="formError" hidden></p>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Enviar enlace</button>
      </form>
      <p id="successMessage" class="text-muted" style="margin-top: var(--space-6);" hidden></p>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById('formError');
    const successEl = document.getElementById('successMessage');
    errorEl.hidden = true;
    const form = new FormData(event.target);

    try {
      const result = await apiFetch('/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email: form.get('email') }),
      });
      event.target.hidden = true;
      successEl.textContent = result.message;
      successEl.hidden = false;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
