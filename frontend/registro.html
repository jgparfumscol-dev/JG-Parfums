<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — JG Parfums</title>
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/favicon-180.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .auth-wrap { padding-top: var(--space-16); padding-bottom: var(--space-16); }
  .form-error { color: var(--danger); margin-bottom: var(--space-4); }
</style>
</head>
<body>
<main>
  <div class="container auth-wrap">
    <div class="access-card">
      <a href="/index.html"><img class="access-mark" src="/assets/logos/jg-star.svg" alt="JG Parfums, inicio"></a>
      <h1 class="h1" style="margin-bottom: var(--space-6);">Crea tu cuenta</h1>

      <form id="registerForm">
        <p class="form-error" id="formError" hidden></p>
        <div class="field">
          <label for="full_name">Nombre completo</label>
          <input id="full_name" name="full_name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="phone">Celular (opcional)</label>
          <input id="phone" name="phone" autocomplete="tel">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
          <p class="text-small text-muted">Mínimo 8 caracteres.</p>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
      </form>

      <div class="access-footer text-muted">
        ¿Ya tienes cuenta? <a class="link" href="/login.html">Inicia sesión</a>
      </div>
    </div>
  </div>
  <div id="dynamicSections"></div>
</main>

<script src="/js/api.js"></script>
<script src="/js/site-settings.js"></script>
<script src="/js/sections.js"></script>
<script>
  renderPageSections('registro');
  document.getElementById('registerForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById('formError');
    errorEl.hidden = true;
    const form = new FormData(event.target);

    try {
      const result = await apiFetch('/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          full_name: form.get('full_name'),
          email: form.get('email'),
          phone: form.get('phone') || null,
          password: form.get('password'),
        }),
      });
      setToken(result.access_token);
      window.location.href = '/mi-cuenta.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
