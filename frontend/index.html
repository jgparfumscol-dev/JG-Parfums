<script>
  // Escalera genérica: se muestra mientras carga el catálogo, y si no hay
  // ningún producto todavía (catálogo vacío) se queda así — nunca se
  // inventan notas ni nombre de producto que el cliente no haya entregado.
  const GENERIC_NOTES = [
    { name: 'Salida', color: '#E3CCA1' },
    { name: 'Corazón', color: '#CB9F4E' },
    { name: 'Fondo', color: '#6A501F' },
  ];

  // Misma escalera que la ficha de producto, pero con el nombre siempre en
  // blanco: el hero es de fondo oscuro y el color de una nota puede ser
  // oscuro también (ilegible como texto ahí) — el color de marca se expresa
  // en la barra, no en la letra. La sección hero (home_hero) ahora es una
  // sección real: puede estar oculta o movida, así que #heroTiers no
  // siempre existe — si no existe, no hay nada que pintar.
  function renderHeroNotes(notes) {
    const container = document.getElementById('heroTiers');
    if (!container) return;
    if (!notes || notes.length === 0) {
      container.innerHTML = '';
      return;
    }
    const total = notes.length;
    container.innerHTML = notes.map((n, i) => `
      <div class="notes-step">
        <span class="notes-step-name" style="color:#FFFFFF;">${n.name}</span>
        <span class="notes-step-track" style="background:#3A3739;"><span class="notes-step-fill" style="width:${Math.round(((i + 1) / total) * 100)}%; background:${n.color};"></span></span>
      </div>
    `).join('');
  }

  function renderHeroProduct(product) {
    const houseEl = document.getElementById('heroHouse');
    if (!houseEl) return; // sección hero oculta: nada que actualizar
    const hasNotes = Boolean(product.notes && product.notes.length > 0);
    houseEl.textContent = product.house ? `${product.house} · ${product.category?.name || 'Perfumería de nicho'}` : 'Perfumería de nicho · Colombia';
    document.getElementById('heroName').textContent = product.name;
    document.getElementById('heroDesc').textContent = hasNotes
      ? `${product.concentration || 'Original'} · ${product.size_ml} ml — notas reales de este frasco.`
      : `${product.concentration || 'Original'} · ${product.size_ml} ml.`;
    document.getElementById('heroCta').textContent = 'Ver ficha completa';
    document.getElementById('heroCta').href = `/producto.html?slug=${encodeURIComponent(product.slug)}`;

    renderHeroNotes(hasNotes ? product.notes : GENERIC_NOTES);
  }

  // La grilla de "Recién llegados" y el hero (home_recent_heading,
  // home_hero) ya son secciones reales y movibles — las arma
  // renderPageSections/sections.js, no este script. Acá solo queda pisar
  // el texto del hero con los datos del producto destacado, una vez que
  // esa sección ya exista en el DOM.
  //
  // El hero es una ficha educativa ("así se lee un perfume"), no la vitrina
  // de un producto cualquiera: solo se pisa su copy genérico (de la sección
  // home_hero) con los datos de un perfume real si el admin marcó explícita-
  // mente ese producto con la estrella de "destacado" en el panel. Si ningún
  // producto está marcado, se deja el texto genérico de la sección tal cual
  // (puede hablar de la tienda, no de una marca de perfume puntual) con la
  // escalera de notas genérica.
  async function loadFeatured() {
    try {
      const data = await apiFetch('/products?is_featured=true&page_size=1');
      if (data.items.length === 0) {
        renderHeroNotes(GENERIC_NOTES);
        return;
      }
      renderHeroProduct(data.items[0]);
    } catch (err) {
      renderHeroNotes(GENERIC_NOTES);
    }
  }

  // El header flota transparente (ver body.home-transparent-nav en
  // components.css) sobre la barra de anuncios + banner de acá abajo, pero
  // solo debe empezar exactamente donde termina la barra de anuncios (no
  // taparla) — su alto varía (puede tener 1 o 2 líneas, cambiar entre
  // mensajes al rotar, o no existir si el admin no configuró ninguna), así
  // que se observa en vez de medir una sola vez: ResizeObserver detecta
  // cualquier cambio de alto (resize de ventana, rotación a un mensaje más
  // largo, etc.) y lo mantiene sincronizado solo.
  function syncHeaderTopOffset() {
    const bar = document.getElementById('pgs-announcement-bar');
    document.documentElement.style.setProperty('--header-top-offset', `${bar ? bar.offsetHeight : 0}px`);
  }
  const announcementBarEl = document.getElementById('pgs-announcement-bar');
  if (announcementBarEl && window.ResizeObserver) {
    new ResizeObserver(syncHeaderTopOffset).observe(announcementBarEl);
  } else {
    window.addEventListener('resize', syncHeaderTopOffset);
  }

  renderPageSections('home').then(() => {
    renderHeroNotes(GENERIC_NOTES);
    loadFeatured();
    syncHeaderTopOffset();
  });
</script>
