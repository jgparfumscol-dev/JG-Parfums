<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido recibido — JG Parfums</title>
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/favicon-180.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .confirm-wrap { max-width: 480px; margin: 0 auto; text-align: center; padding-top: var(--space-24); padding-bottom: var(--space-16); }
  .confirm-star { width: 32px; height: 32px; margin-inline: auto; margin-bottom: var(--space-6); }
  .order-items { text-align: left; margin-top: var(--space-8); margin-bottom: var(--space-8); padding: var(--space-6); border: 1px solid var(--ink-100); }
  .status-badge { display: inline-block; margin-bottom: var(--space-4); }
</style>
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a href="/index.html" aria-label="JG Parfums, inicio">
      <img class="nav-logo" src="/assets/logos/jg-parfums-horizontal.svg" alt="JG Parfums">
    </a>
  </div>
</header>

<main>
  <div class="container confirm-wrap">
    <img class="confirm-star" src="/assets/logos/jg-star.svg" alt="">
    <div id="confirmContent">
      <h1 class="h1">Recibimos tu pedido</h1>
      <p class="text-muted">Estamos confirmando el pago. Te avisamos por correo apenas quede listo.</p>
    </div>
    <a class="btn btn-secondary" href="/catalogo.html" style="margin-top: var(--space-6);">Seguir viendo el catálogo</a>
  </div>
  <div id="dynamicSections"></div>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <img src="/assets/logos/jg-parfums-horizontal-blanco.svg" alt="JG Parfums" style="height:24px;">
      <p class="text-muted text-small" style="margin-top:var(--space-4);">Perfumería de nicho en Colombia.</p>
    </div>
    <div>
      <p class="text-caption" style="margin-bottom:var(--space-3);">Tienda</p>
      <ul class="footer-links">
        <li><a href="/catalogo.html" class="text-muted">Catálogo</a></li>
        <li><a href="/mi-cuenta.html" class="text-muted">Mi cuenta</a></li>
        <li><a href="/carrito.html" class="text-muted">Carrito</a></li>
      </ul>
    </div>
    <div>
      <p class="text-caption" style="margin-bottom:var(--space-3);">Pago seguro</p>
      <p class="text-muted text-small">Tarjetas, PSE, Nequi, botón Bancolombia y Mercado Pago.</p>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/sections.js"></script>
<script>
  renderPageSections('pedido-confirmado');
  const STATUS_LABEL = {
    pending: { text: 'Pago pendiente de confirmación', cls: 'badge-warning' },
    paid: { text: 'Pago confirmado', cls: 'badge-success' },
    processing: { text: 'En preparación', cls: 'badge-success' },
    shipped: { text: 'Enviado', cls: 'badge-success' },
    completed: { text: 'Entregado', cls: 'badge-success' },
    cancelled: { text: 'Pago no confirmado', cls: 'badge-danger' },
  };

  async function loadOrder() {
    const orderNumber = new URLSearchParams(window.location.search).get('order');
    if (!orderNumber) return;
    // El email de sessionStorage solo existe recién salido del checkout como
    // invitado. Si hay sesión iniciada, apiFetch ya manda el JWT y el backend
    // resuelve el permiso por dueño del pedido — no hace falta el email.
    const email = sessionStorage.getItem('jg_last_order_email');
    const query = email ? `?email=${encodeURIComponent(email)}` : '';

    try {
      const order = await apiFetch(`/orders/${encodeURIComponent(orderNumber)}${query}`);
      const status = STATUS_LABEL[order.status] || { text: order.status, cls: 'badge-warning' };
      document.getElementById('confirmContent').innerHTML = `
        <p class="badge ${status.cls} status-badge">${status.text}</p>
        <h1 class="h1">Pedido ${order.order_number}</h1>
        <p class="text-muted">Enviamos el detalle a ${order.guest_email}.</p>
        <div class="order-items">
          <p class="summary-heading" style="font-size:12px;letter-spacing:0.03em;color:var(--text-muted);margin:0 0 var(--space-2);">Detalle del pedido</p>
          ${order.items.map((item) => `
            <div class="ledger-row text-small"><span>${item.product_name} × ${item.quantity}</span><span>${formatCOP(item.unit_price * item.quantity)}</span></div>
          `).join('')}
          <div class="ledger-row ledger-row-total"><span>Total</span><span>${formatCOP(order.total)}</span></div>
        </div>
      `;
    } catch (err) {
      // sin permiso o pedido no encontrado: se deja el mensaje genérico por defecto
    }
  }
  loadOrder();
</script>
</body>
</html>
