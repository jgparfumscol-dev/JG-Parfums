<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elegir nueva contraseña — JG Parfums</title>
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/favicon-180.png">
<link rel="stylesheet" href="/css/tokens.css?v=20260922d">
<link rel="stylesheet" href="/css/components.css?v=20260922d">
<style>
  .form-error { color: var(--danger); margin-bottom: var(--space-4); }

  /* Mismo layout de pantalla dividida que login.html — ver ahí el
     detalle de cada regla. Se repite acá (page-scoped) en vez de
     compartirse en components.css porque es un tratamiento puntual de
     las cuatro páginas de acceso, no un componente reusado en el resto
     del sitio. */
  .login-screen { position: relative; }

  .login-bg img {
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    object-fit: cover;
    object-position: center;
    z-index: -2;
  }

  /* Blanco suave al 30% (no una capa sólida) — ver el detalle en
     login.html. */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, .3);
    z-index: -1;
  }

  .login-panel { padding: var(--space-16) var(--space-6); }

  .access-card { border-radius: var(--radius); }

  /* Móvil/tablet (<1024px): el form no debe tapar la foto de fondo con
     una capa opaca ni sólida — ver el detalle de esta misma regla en
     login.html. */
  @media (max-width: 1023px) {
    .access-card {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      border: none !important;
      /* Halo blanco por text-shadow (se hereda al texto de adentro) en
         vez de una capa — ver el detalle en login.html. */
      text-shadow: 0 1px 2px rgba(255, 255, 255, .95), 0 0 10px rgba(255, 255, 255, .85), 0 0 20px rgba(255, 255, 255, .55);
    }
    /* Mismo negro que el título para labels y texto muted — ver el
       detalle en login.html. */
    .access-card .field label,
    .access-card .text-muted {
      color: var(--jg-onyx);
    }
  }

  @media (min-width: 1024px) {
    html, body { height: 100%; overflow: hidden; }

    .login-screen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 100dvh;
      height: 100dvh;
      overflow: hidden;
    }

    .login-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow-y: auto;
      padding: var(--space-12);
    }

    .login-art {
      padding: var(--space-6);
      box-sizing: border-box;
      border-right: 1px solid var(--ink-100);
    }
    .login-bg {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
    }
    .login-bg img {
      position: static;
      width: 100%;
      height: 100%;
      z-index: auto;
      border-radius: 24px;
    }
    .login-overlay { display: none; }
  }
</style>
</head>
<body>
<div id="pgs-announcement-bar"></div>
<main>
<div class="login-screen">
  <div class="login-panel">
    <div class="access-card">
      <a href="/index.html"><img class="access-mark" src="/assets/logos/jg-star.svg" alt="JG Parfums, inicio"></a>
      <h1 class="h1" style="margin-bottom: var(--space-6);">Elige una nueva contraseña</h1>

      <form id="resetForm">
        <p class="form-error" id="formError" hidden></p>
        <div class="field">
          <label for="new_password">Nueva contraseña</label>
          <input id="new_password" name="new_password" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Guardar contraseña</button>
      </form>
      <p id="successMessage" class="text-muted" style="margin-top: var(--space-6);" hidden></p>
    </div>
  </div>

  <div class="login-art">
    <picture class="login-bg" aria-hidden="true">
      <source media="(min-width: 1024px)" srcset="/assets/logos/jg-parfums-pixel-art-desktop.jpg">
      <img src="/assets/logos/jg-parfums-pixel-art-mobile.jpg" alt="" loading="eager" fetchpriority="high">
    </picture>
  </div>
  <div class="login-overlay" aria-hidden="true"></div>
</div>
<div id="dynamicSections"></div>
</main>

<script src="/js/api.js?v=20260924a"></script>
<script src="/js/site-settings.js?v=20260924a"></script>
<script src="/js/sections.js?v=20260924a"></script>
<script src="/js/reveal.js?v=20260924a"></script>
<script>
  renderPageSections('reset-password');
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('resetForm').hidden = true;
    document.getElementById('formError').textContent = 'Enlace inválido. Solicita uno nuevo desde "Olvidé mi contraseña".';
    document.getElementById('formError').hidden = false;
  }

  document.getElementById('resetForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById('formError');
    const successEl = document.getElementById('successMessage');
    errorEl.hidden = true;
    const form = new FormData(event.target);

    try {
      const result = await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ token, new_password: form.get('new_password') }),
      });
      event.target.hidden = true;
      successEl.innerHTML = `${result.message}. <a class="link" href="/login.html">Inicia sesión</a>.`;
      successEl.hidden = false;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
