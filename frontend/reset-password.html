<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elegir nueva contraseña — JG Parfums</title>
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/favicon-180.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .auth-wrap { padding-top: var(--space-16); padding-bottom: var(--space-16); }
  .form-error { color: var(--danger); margin-bottom: var(--space-4); }
</style>
</head>
<body>
<main>
  <div class="container auth-wrap">
    <div class="access-card">
      <a href="/index.html"><img class="access-mark" src="/assets/logos/jg-star.svg" alt="JG Parfums, inicio"></a>
      <h1 class="h1" style="margin-bottom: var(--space-6);">Elige una nueva contraseña</h1>

      <form id="resetForm">
        <p class="form-error" id="formError" hidden></p>
        <div class="field">
          <label for="new_password">Nueva contraseña</label>
          <input id="new_password" name="new_password" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Guardar contraseña</button>
      </form>
      <p id="successMessage" class="text-muted" style="margin-top: var(--space-6);" hidden></p>
    </div>
  </div>
  <div id="dynamicSections"></div>
</main>

<script src="/js/api.js"></script>
<script src="/js/site-settings.js"></script>
<script src="/js/sections.js"></script>
<script>
  renderPageSections('reset-password');
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('resetForm').hidden = true;
    document.getElementById('formError').textContent = 'Enlace inválido. Solicita uno nuevo desde "Olvidé mi contraseña".';
    document.getElementById('formError').hidden = false;
  }

  document.getElementById('resetForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById('formError');
    const successEl = document.getElementById('successMessage');
    errorEl.hidden = true;
    const form = new FormData(event.target);

    try {
      const result = await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ token, new_password: form.get('new_password') }),
      });
      event.target.hidden = true;
      successEl.innerHTML = `${result.message}. <a class="link" href="/login.html">Inicia sesión</a>.`;
      successEl.hidden = false;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
