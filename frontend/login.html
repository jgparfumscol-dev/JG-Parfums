<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — JG Parfums</title>
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/favicon-180.png">
<link rel="stylesheet" href="/css/tokens.css?v=20260922d">
<link rel="stylesheet" href="/css/components.css?v=20260922d">
<style>
  .form-error { color: var(--danger); margin-bottom: var(--space-4); }

  /* Pantalla dividida desde 1024px (mismo quiebre de escritorio que el
     resto del sitio, ver tokens.css): form a la izquierda, imagen a la
     derecha, sin scroll de página. Antes de eso es una sola columna con
     la imagen vertical de fondo fijo detrás del form, que sigue en flujo
     normal y puede scrollear si hace falta. */
  .login-screen { position: relative; }

  .login-bg img {
    /* Pixel art: que no se suavice al escalar (crisp-edges como
       respaldo en navegadores sin soporte para pixelated). Esto no
       afecta color/opacidad de la imagen, solo el algoritmo de escalado. */
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    object-fit: cover;
    object-position: center;
    z-index: -2;
  }

  /* Blanco suave (no Marfil como antes) al 30% — deja pasar el color real
     de la foto, solo le baja un poco el contraste general para que,
     sumado al text-shadow de acá abajo, el texto se lea en cualquier
     zona de la imagen (clara u oscura). En escritorio sigue apagada
     (ver @media min-width:1024px más abajo). */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, .3);
    z-index: -1;
  }

  .login-panel { padding: var(--space-16) var(--space-6); }

  .access-card { border-radius: var(--radius); }

  /* Móvil/tablet (<1024px): el form no debe tapar la foto de fondo con
     una capa opaca ni sólida. La única otra regla que toca .access-card
     en todo el sitio es components.css:796-802 (max-width, padding,
     border 1px ink-100, background var(--jg-white) — ninguna de las dos
     define blur o box-shadow); acá se apaga esa capa blanca y el borde
     con !important para que no quede duda de cuál gana. Lo único que
     queda entre el texto y la foto es el wash blanco al 30% de
     .login-overlay (arriba) más este halo por text-shadow — no una capa
     sólida ni un blur, así la foto se sigue viendo con sus colores. */
  @media (max-width: 1023px) {
    .access-card {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      border: none !important;
      /* Se hereda a todo el texto de adentro (h1, labels, links, texto
         muted); los <input> no lo necesitan, tienen su propio fondo
         blanco opaco. */
      text-shadow: 0 1px 2px rgba(255, 255, 255, .95), 0 0 10px rgba(255, 255, 255, .85), 0 0 20px rgba(255, 255, 255, .55);
    }
    /* El halo de arriba no alcanzaba para "Correo"/"Contraseña" ni para
       "¿No tienes cuenta?...": ambos usan --text-muted (gris, pensado
       para fondo blanco sólido), mucho más débil que el ink-900 del
       título — quedaban leyéndose peor que "Inicia sesión" aun con el
       mismo halo. Mismo negro que el título acá en vez del gris de
       siempre. Los <a class="link"> (Olvidé mi contraseña, Regístrate,
       compra como invitado) ya usan --jg-onyx propio, no hace falta
       tocarlos. */
    .access-card .field label,
    .access-card .text-muted {
      color: var(--jg-onyx);
    }
  }

  @media (min-width: 1024px) {
    html, body { height: 100%; overflow: hidden; }

    .login-screen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      /* Fila explícita en vez de "auto": sin esto, el alto de la fila se
         calcula a partir del contenido de sus items (circular con
         .login-bg img y .login-panel queriendo 100% de esa misma fila) y
         el navegador termina mandando cada uno a su propia fila. */
      grid-template-rows: 100dvh;
      height: 100dvh;
      overflow: hidden;
    }

    .login-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow-y: auto;
      padding: var(--space-12);
    }

    /* Columna de la foto con "marco": padding a modo de margen + radio
       marcado (no el de 2px de botones/inputs — acá es a propósito más
       visible, una excepción decorativa puntual para esta foto, no un
       componente de UI) recortando la imagen adentro. El tamaño de la
       columna no cambia — la foto se ve más chica solo por el padding
       del marco, igual que antes ocupa la mitad de la pantalla. */
    .login-art {
      padding: var(--space-6);
      box-sizing: border-box;
      border-right: 1px solid var(--ink-100);
    }
    .login-bg {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
    }
    /* La imagen deja de ser fondo fijo y pasa a llenar su columna (menos
       el padding del marco) a alto completo — sin borde ni sombra propios,
       el marco de afuera ya los trae. */
    .login-bg img {
      position: static;
      width: 100%;
      height: 100%;
      z-index: auto;
      border-radius: 24px;
    }
    .login-overlay { display: none; }
  }
</style>
</head>
<body>
<div id="pgs-announcement-bar"></div>
<main>
<div class="login-screen">
  <div class="login-panel">
    <div class="access-card">
      <a href="/index.html"><img class="access-mark" src="/assets/logos/jg-star.svg" alt="JG Parfums, inicio"></a>
      <h1 class="h1" style="margin-bottom: var(--space-6);">Inicia sesión</h1>

      <form id="loginForm">
        <p class="form-error" id="formError" hidden></p>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>

      <div class="access-footer">
        <p><a class="link" href="/recuperar-password.html">Olvidé mi contraseña</a></p>
        <p class="text-muted" style="margin-top: var(--space-3);">
          ¿No tienes cuenta? <a class="link" href="/registro.html">Regístrate</a> o
          <a class="link" href="/catalogo.html">compra como invitado</a>.
        </p>
      </div>
    </div>
  </div>

  <div class="login-art">
    <picture class="login-bg" aria-hidden="true">
      <source media="(min-width: 1024px)" srcset="/assets/logos/jg-parfums-pixel-art-desktop.jpg">
      <img src="/assets/logos/jg-parfums-pixel-art-mobile.jpg" alt="" loading="eager" fetchpriority="high">
    </picture>
  </div>
  <div class="login-overlay" aria-hidden="true"></div>
</div>
<div id="dynamicSections"></div>
</main>

<script src="/js/api.js?v=20260924a"></script>
<script src="/js/site-settings.js?v=20260924a"></script>
<script src="/js/sections.js?v=20260924a"></script>
<script src="/js/reveal.js?v=20260924a"></script>
<script>
  renderPageSections('login');
  document.getElementById('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById('formError');
    errorEl.hidden = true;
    const form = new FormData(event.target);

    try {
      const result = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: form.get('email'), password: form.get('password') }),
      });
      setToken(result.access_token);
      const redirectTo = new URLSearchParams(window.location.search).get('next') || '/mi-cuenta.html';
      window.location.href = redirectTo;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
