<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — JG Parfums</title>
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/favicon-180.png">
<link rel="stylesheet" href="/css/tokens.css?v=20260922c">
<link rel="stylesheet" href="/css/components.css?v=20260922c">
<style>
  .auth-wrap { padding-top: var(--space-16); padding-bottom: var(--space-16); }
  .form-error { color: var(--danger); margin-bottom: var(--space-4); }

  /* Dos columnas en escritorio (form a la izquierda, pixel art a la
     derecha); en móvil la imagen queda arriba y el form abajo, así que el
     orden se resuelve con grid-template-areas en vez del orden del DOM. */
  .login-layout {
    display: grid;
    gap: var(--space-8);
    grid-template-areas: "art" "form";
    align-items: start;
  }
  .login-layout .login-art { grid-area: art; }
  .login-layout .access-card { grid-area: form; }
  @media (min-width: 900px) {
    .login-layout {
      grid-template-columns: 1.1fr 0.9fr;
      grid-template-areas: "form art";
      align-items: center;
      gap: var(--space-16);
    }
  }

  /* El pixel art es una ilustración vivida y saturada; el resto de la
     tienda es editorial y contenida (dorado/onyx, sin sombras fuertes). El
     filtro le baja saturación y le suma un tinte cálido, y el degradado en
     ::after termina de mezclarlo con la paleta de marca en vez de dejarlo
     como una foto pegada aparte. */
  .login-art {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--ink-100);
    background: var(--jg-onyx);
    aspect-ratio: 16 / 9;
  }
  @media (min-width: 900px) {
    .login-art { aspect-ratio: auto; height: clamp(420px, 60vh, 640px); }
  }
  .login-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.6) sepia(.18) contrast(1.05) brightness(.96);
  }
  .login-art::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(165deg, rgba(211, 174, 106, .3), rgba(32, 30, 31, .55));
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
<div id="pgs-announcement-bar"></div>
<main>
  <div class="container auth-wrap">
    <div class="login-layout">
      <div class="login-art" aria-hidden="true">
        <picture>
          <source media="(min-width: 900px)" srcset="/assets/logos/jg-parfums-pixel-art-vertical.jpg">
          <img src="/assets/logos/jg-parfums-pixel-art-horizontal.jpg" alt="" loading="eager">
        </picture>
      </div>
      <div class="access-card">
        <a href="/index.html"><img class="access-mark" src="/assets/logos/jg-star.svg" alt="JG Parfums, inicio"></a>
        <h1 class="h1" style="margin-bottom: var(--space-6);">Inicia sesión</h1>

        <form id="loginForm">
          <p class="form-error" id="formError" hidden></p>
          <div class="field">
            <label for="email">Correo</label>
            <input id="email" name="email" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        </form>

        <div class="access-footer">
          <p><a class="link" href="/recuperar-password.html">Olvidé mi contraseña</a></p>
          <p class="text-muted" style="margin-top: var(--space-3);">
            ¿No tienes cuenta? <a class="link" href="/registro.html">Regístrate</a> o
            <a class="link" href="/catalogo.html">compra como invitado</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
  <div id="dynamicSections"></div>
</main>

<script src="/js/api.js?v=20260922c"></script>
<script src="/js/site-settings.js?v=20260922c"></script>
<script src="/js/sections.js?v=20260922c"></script>
<script src="/js/reveal.js?v=20260922c"></script>
<script>
  renderPageSections('login');
  document.getElementById('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById('formError');
    errorEl.hidden = true;
    const form = new FormData(event.target);

    try {
      const result = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: form.get('email'), password: form.get('password') }),
      });
      setToken(result.access_token);
      const redirectTo = new URLSearchParams(window.location.search).get('next') || '/mi-cuenta.html';
      window.location.href = redirectTo;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
